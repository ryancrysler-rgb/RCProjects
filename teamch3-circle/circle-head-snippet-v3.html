function parentOnly(){var s=document.querySelector('[data-circle="app-sidebar"]');if(!s||!s.querySelector('a[data-id="'+PARENTS_ID+'"]'))return false;return !["2904211","2904213","2904214","2904215"].some(function(id){return s.querySelector('a[data-id="'+id+'"]');});}

function parentLanding(){if(window.__ch3ParentSent||!parentOnly())return;var p=location.pathname;if(p!=="/"&&p!=="/feed"&&!onPath("/c/global"))return;var a=document.querySelector('[data-circle="app-sidebar"] a[data-id="'+PARENTS_ID+'"]');if(a){window.__ch3ParentSent=1;a.click();}}

function onPath(base){var p=location.pathname;return p===base||p.indexOf(base+"/")===0;}
function current(){var all=BASECAMPS.concat(HEADERS);for(var i=0;i<all.length;i++){if(onPath(all[i][1]))return all[i];}return null;}
/* Basecamp pills: only shows basecamps this member can see in the sidebar */
/* Fade the right edge of the basecamp buttons while more of them are off-screen */
function more(el){var m=el.scrollWidth-el.clientWidth-el.scrollLeft>4;if(m!==el.hasAttribute("data-more")){if(m)el.setAttribute("data-more","");else el.removeAttribute("data-more");}}
function pills(){
var host=document.querySelector('[data-circle="app-content"]');if(!host)return;
var side=document.querySelector('[data-circle="app-sidebar"]');
var list=parentOnly()?[]:BASECAMPS.filter(function(b){return side?side.querySelector('a[data-id="'+b[0]+'"]'):b[0]!=="2904211"});
var el=document.getElementById("ch3-basecamps");
if(!list.length){if(el)el.remove();return;}
if(!el||el.parentNode!==host){if(el)el.remove();el=document.createElement("nav");el.id="ch3-basecamps";el.setAttribute("aria-label","Basecamps");host.insertBefore(el,host.firstChild);}
var h=list.map(function(b){return '<a href="'+b[1]+'" data-id="'+b[0]+'"'+(onPath(b[1])?' aria-current="page"':'')+'><b>'+b[3]+'</b>'+b[2]+'</a>'}).join("");
if(el.getAttribute("data-h")!==h){el.innerHTML=h;el.setAttribute("data-h",h);}
if(!el.__ch3Scroll){el.__ch3Scroll=1;el.addEventListener("scroll",function(){more(el);},{passive:true});}
var cur=el.querySelector("a[aria-current]");
if(cur&&el.getAttribute("data-cur")!==cur.getAttribute("data-id")){el.setAttribute("data-cur",cur.getAttribute("data-id"));if(cur.offsetLeft+cur.offsetWidth>el.scrollLeft+el.clientWidth||cur.offsetLeft<el.scrollLeft)el.scrollLeft=cur.offsetLeft-el.clientWidth/2+cur.offsetWidth/2;}
more(el);
/* line the pills up with the page header below them */
var ph=host.querySelector('[data-circle="page-header"]');
if(ph){var pad=Math.max(16,Math.round(ph.getBoundingClientRect().left-host.getBoundingClientRect().left))+"px";if(el.style.paddingLeft!==pad){el.style.paddingLeft=pad;el.style.paddingRight=pad;}}
}
/* Basecamp header: code badge, eyebrow and subline around Circle's own title */
function header(){
var h1=document.querySelector('[data-circle="page-header"] h1');if(!h1)return;
var b=current(),row=h1.parentNode,old=document.getElementById("ch3-hdr-badge");
if(old&&(!b||old.getAttribute("data-key")!==b[0]||old.parentNode!==row)){["ch3-hdr-badge","ch3-hdr-eyebrow","ch3-hdr-sub"].forEach(function(id){var n=document.getElementById(id);if(n)n.remove();});old=null;}
if(!b||old)return;
var badge=document.createElement("div");badge.id="ch3-hdr-badge";badge.setAttribute("data-key",b[0]);badge.setAttribute("aria-hidden","true");badge.textContent=b[3];
if(b[6]){badge.setAttribute("data-logo",b[7]||"wide");badge.style.backgroundImage='url("'+b[6]+'")';}
var eyebrow=document.createElement("div");eyebrow.id="ch3-hdr-eyebrow";eyebrow.textContent=b[4];
var sub=document.createElement("p");sub.id="ch3-hdr-sub";sub.textContent=b[5];
row.insertBefore(badge,h1);row.insertBefore(eyebrow,h1);row.insertBefore(sub,h1.nextSibling);
}
/* Row under Circle's "Start a post" box: Send your golf data to RC Greenlight · Ask a coach */
function compose(){
var sb=document.querySelector('[data-circle="app-content"] button[aria-label="Start a post"]');
var card=sb&&sb.closest('[role="button"]');
var el=document.getElementById("ch3-compose");
if(!card){if(el)el.remove();return;}
var po=parentOnly()?"1":"0";
if(el&&el.previousElementSibling===card&&el.getAttribute("data-p")===po)return;
if(el)el.remove();
el=document.createElement("div");el.id="ch3-compose";el.setAttribute("data-p",po);
var a=document.createElement(GREENLIGHT_URL?"a":"div");if(GREENLIGHT_URL){a.href=GREENLIGHT_URL;a.target="_blank";a.rel="noopener";}a.innerHTML='<i aria-hidden="true">▲</i>Send your golf data to RC Greenlight';
var b;
if(ASK_CH3_URL){b=document.createElement("a");b.href=ASK_CH3_URL;b.innerHTML='<i aria-hidden="true">?</i>Ask CH3';}
else{b=document.createElement("button");b.type="button";b.innerHTML='<i aria-hidden="true">?</i>Ask a coach';
b.addEventListener("click",function(){var c=document.querySelector('[data-circle="app-content"] button[aria-label="Start a post"]');c=c&&c.closest('[role="button"]');if(c)c.click();});}
if(po!=="1")el.appendChild(a);el.appendChild(b);
card.parentNode.insertBefore(el,card.nextSibling);
}

document.addEventListener("click",function(e){

/* the link's own ⋯ edit/delete menu sits inside the link: leave its clicks to Circle */
if(e.target.closest&&e.target.closest('button,[role="button"],[role="menu"],[role="menuitem"],[aria-haspopup]'))return;
var a=e.target.closest&&e.target.closest('[data-circle="app-sidebar"] a[target="_blank"]');if(!a)return;
var u;try{u=new URL(a.getAttribute("href"),location.href);}catch(x){return;}
if(u.host!==location.host)return;

if(same&&!u.search&&!u.hash)same.click();else location.assign(u.href);
},true);
/* Community rules before a member's first post */
function rules(done){
if(document.getElementById("ch3-rules"))return;
var w=document.createElement("div");w.id="ch3-rules";w.setAttribute("role","dialog");w.setAttribute("aria-modal","true");w.setAttribute("aria-label","Basecamp community rules");
w.style.cssText="position:fixed;inset:0;z-index:100000;background:rgba(17,26,34,.55);display:flex;align-items:center;justify-content:center;padding:24px";
w.innerHTML='<div style="width:100%;max-width:460px;background:#fff;border-radius:12px;overflow:hidden;font-family:\'Barlow Condensed\',sans-serif"><div style="background:#253746;color:#fff;padding:18px 22px;border-bottom:3px solid #E04E39"><div style="font:600 12px/1 \'Barlow Condensed\';letter-spacing:.14em;color:#F47C67">BEFORE YOU POST</div><div style="font:400 28px/1 Anton,sans-serif;text-transform:uppercase;margin-top:6px">Basecamp community rules</div></div><div style="padding:18px 22px;display:flex;flex-direction:column;gap:8px;font:400 17px/1.35 \'Barlow Condensed\';color:#384B5B"><span>1. Respect every member, coach and junior.</span><span>2. No harassment, hate, sexual content or spam.</span><span>3. Only post video of yourself, or with permission.</span><span>4. No contact details or private messages to juniors.</span><span>Breaking the rules can lead to removal. Reports are reviewed within 24 hours. <a href="/c/community-rules" style="color:#C9432F">Read the full rules</a></span></div><div style="display:flex;gap:6px;padding:0 22px 22px"><button type="button" data-ch3="agree" style="flex:1;height:48px;border:none;border-radius:6px;cursor:pointer;background:#C9432F;color:#fff;font:700 16px/1 \'Barlow Condensed\';letter-spacing:.08em">I AGREE · CONTINUE</button><button type="button" data-ch3="cancel" style="flex:none;padding:0 18px;height:48px;border:1px solid #CDD4DA;border-radius:6px;cursor:pointer;background:#fff;color:#253746;font:600 16px/1 \'Barlow Condensed\'">Cancel</button></div></div>';
function close(){w.remove();document.removeEventListener("keydown",esc,true);}
function esc(k){if(k.key==="Escape")close();}
w.addEventListener("click",function(ev){var b=ev.target.getAttribute&&ev.target.getAttribute("data-ch3");if(ev.target===w||b==="cancel")close();if(b==="agree"){try{localStorage.setItem(RULES_KEY,"1")}catch(x){}close();setTimeout(done,0);}});
document.addEventListener("keydown",esc,true);
document.body.appendChild(w);w.querySelector('[data-ch3="agree"]').focus();
}
document.addEventListener("click",function(e){
try{if(localStorage.getItem(RULES_KEY))return;}catch(x){return;}
var t=e.target.closest&&e.target.closest('[data-circle="feed-new-post-button"],button,[role="button"]');if(!t)return;
var txt=(t.textContent||"").trim();
if(!(t.matches('[data-circle="feed-new-post-button"]')||txt==="New post"||txt.indexOf("Start a post")===0))return;
e.preventDefault();e.stopPropagation();
rules(function(){t.click();});
},true);
/* Post badges: the prefix before the colon becomes the badge and is removed from the title */
var BADGES=[["new session","NEW SESSION","session"],["live recording","LIVE RECORDING","live"],["on tour","ON TOUR","tour"],["new episode","NEW EPISODE","episode"],["standings","BASECAMP STANDINGS","standings"]];
function badges(){
document.querySelectorAll('[data-circle="post-title"]').forEach(function(t){
var w=document.createTreeWalker(t,NodeFilter.SHOW_TEXT),n;while((n=w.nextNode())&&!n.data.trim()){}
if(!n)return;
var hit=null;BADGES.some(function(B){var re=new RegExp("^\\s*"+B[0]+"\\s*:\\s*","i");if(re.test(n.data)){hit=[B,re];return true;}return false;});
if(hit){n.data=n.data.replace(hit[1],"");t.setAttribute("data-ch3-badge",hit[0][1]);t.setAttribute("data-ch3-kind",hit[0][2]);t.setAttribute("data-ch3-title",t.textContent);}
else if(t.hasAttribute("data-ch3-badge")&&t.getAttribute("data-ch3-title")!==t.textContent){["data-ch3-badge","data-ch3-kind","data-ch3-title"].forEach(function(a){t.removeAttribute(a);});}
});
}
/* Circle is a single-page app: re-apply after every render */
var q=0;function run(){q=0;parentLanding();pills();header();compose();badges();}
new MutationObserver(function(){if(!q){q=requestAnimationFrame(run);}}).observe(document.documentElement,{childList:true,subtree:true});
window.addEventListener("resize",function(){if(!q){q=requestAnimationFrame(run);}});
if(document.readyState!=="loading")run();else document.addEventListener("DOMContentLoaded",run);
})();
